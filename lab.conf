# Roteador de Borda
r0[0]="wan"
r0[bridged]=true
r0[sysctl]="net.ipv4.ip_forward=1"

# Firewall (Middlebox)
fw[0]="wan"
fw[1]="lan"
fw[2]="dmz"
fw[3]="mgmt"
fw[sysctl]="net.ipv4.ip_forward=1"

# Estações e Proxy da LAN
pc1[0]="lan"
pc2[0]="lan"
proxy[0]="lan"

# Servidores da DMZ (Reverse Proxy, Web e DNS)
rp[0]="dmz"
web[0]="dmz"
dns[0]="dmz"

# Estação de Gerenciamento
adm[0]="mgmt"